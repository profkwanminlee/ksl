<div class="korean-roof-accent" aria-hidden="true">
  <!-- Traditional Korean Hanok Roof Crest & Maehwa Blossom Ornament (Inspired by v1.png & v2.png) -->
  <svg width="220" height="28" viewBox="0 0 220 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="hero-accent-svg">

          fill="var(--color-yellow-gold)" stroke="#141517" stroke-width="1"/>

    <path d="M 28 15 C 48 16 68 12 88 9 L 88 12 C 68 15 48 19 28 18 Z" fill="var(--color-red)"/>
    <!-- Left Decorative Cloud Scroll / Vein Tendril -->
    <path d="M 4 22 C 14 20 28 22 42 20" stroke="var(--color-yellow-gold)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="18" r="1.8" fill="var(--color-yellow-gold)"/>

    <path d="M 192 15 C 172 16 152 12 132 9 L 132 12 C 152 15 172 19 192 18 Z" fill="var(--color-red)"/>

    <circle cx="208" cy="18" r="1.8" fill="var(--color-yellow-gold)"/>

      <path d="M 0,-3 C -4,-5 -5,-12 0,-13 C 5,-12 4,-5 0,-3 Z" fill="var(--color-red)" stroke="#141517" stroke-width="1"/>

      <path d="M 0,-3 C -4,-5 -5,-12 0,-13 C 5,-12 4,-5 0,-3 Z" fill="var(--color-red)" stroke="#141517" stroke-width="1" transform="rotate(144)"/>
      <path d="M 0,-3 C -4,-5 -5,-12 0,-13 C 5,-12 4,-5 0,-3 Z" fill="var(--color-red)" stroke="#141517" stroke-width="1" transform="rotate(216)"/>
      <path d="M 0,-3 C -4,-5 -5,-12 0,-13 C 5,-12 4,-5 0,-3 Z" fill="var(--color-red)" stroke="#141517" stroke-width="1" transform="rotate(288)"/>

      <!-- Center Golden Hub -->
      <circle cx="0" cy="0" r="3.6" fill="var(--color-yellow-gold)" stroke="#141517" stroke-width="1"/>

      <!-- 5 Golden Anther Stamen Dots -->
      <circle cx="0" cy="-8" r="1.1" fill="var(--color-yellow-gold)"/>
      <circle cx="7.6" cy="-2.5" r="1.1" fill="var(--color-yellow-gold)"/>

      <circle cx="-4.7" cy="6.5" r="1.1" fill="var(--color-yellow-gold)"/>
      <circle cx="-7.6" cy="-2.5" r="1.1" fill="var(--color-yellow-gold)"/>
