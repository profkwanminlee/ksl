<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>{% if page.title and page.title != "Home" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} — {{ site.institution_short }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">

<!-- Favicon / Tab Icons: Official NTU Logo -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/ntu.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/images/ntu.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/ntu.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">

<!-- Open Graph / Meta -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<meta property="og:image" content="{{ '/images/korea1.jpg' | relative_url }}">

<!-- Google Fonts: Plus Jakarta Sans for ALL text + Noto Serif KR / Noto Sans KR for Korean glyphs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

<!-- Preload Hero Assets -->
<link rel="preload" as="image" href="{{ '/images/ntu-logo.png' | relative_url }}">
<link rel="preload" as="image" href="{{ '/images/korea1.jpg' | relative_url }}" fetchpriority="high">

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- Dynamic Theme Overrides (Editable via _data/theme.yml or Sveltia CMS) -->
{% if site.data.theme %}
<style>
  :root {
    {% if site.data.theme.colors.primary_red %}--color-red: {{ site.data.theme.colors.primary_red }};{% endif %}
    {% if site.data.theme.colors.primary_red_hover %}--color-red-hover: {{ site.data.theme.colors.primary_red_hover }};{% endif %}
    {% if site.data.theme.colors.accent_gold %}--color-yellow-gold: {{ site.data.theme.colors.accent_gold }};{% endif %}
    {% if site.data.theme.colors.accent_gold_soft %}--color-yellow-gold-soft: {{ site.data.theme.colors.accent_gold_soft }};{% endif %}
    {% if site.data.theme.colors.brown_deep %}--color-brown-deep: {{ site.data.theme.colors.brown_deep }};{% endif %}
    {% if site.data.theme.colors.canvas_bg %}--color-canvas: {{ site.data.theme.colors.canvas_bg }};{% endif %}
    {% if site.data.theme.colors.surface_card %}--color-surface: {{ site.data.theme.colors.surface_card }};{% endif %}
    {% if site.data.theme.colors.surface_warm %}--color-surface-warm: {{ site.data.theme.colors.surface_warm }};{% endif %}
    {% if site.data.theme.colors.ink_primary %}--color-ink: {{ site.data.theme.colors.ink_primary }};{% endif %}
    {% if site.data.theme.colors.ink_muted %}--color-ink-muted: {{ site.data.theme.colors.ink_muted }};{% endif %}
    {% if site.data.theme.colors.border_color %}--color-border: {{ site.data.theme.colors.border_color }};{% endif %}
    {% if site.data.theme.typography.base_font_size %}font-size: {{ site.data.theme.typography.base_font_size }};{% endif %}
  }
  {% if site.data.theme.ornaments.show_hero_roof_accent == false %}
  .korean-roof-accent { display: none !important; }
  {% endif %}
  {% if site.data.theme.ornaments.show_flower_dividers == false %}
  .korean-divider { display: none !important; }
  {% endif %}
  {% if site.data.theme.ornaments.show_title_underlines == false %}
  .korean-title-underline { display: none !important; }
  {% endif %}
  {% if site.data.theme.ornaments.show_hero_lattice_pattern == false %}
  .hero-lattice-layer { display: none !important; }
  {% endif %}
</style>
{% endif %}
