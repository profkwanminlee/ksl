<div class="korean-pavilion-badge" aria-hidden="true">
  <!-- Traditional Korean Hanok Pavilion (Jeongja 정자) - Inspired by v2.png -->
  <svg width="76" height="62" viewBox="0 0 100 82" fill="none" xmlns="http://www.w3.org/2000/svg" class="pavilion-svg">
    <!-- Top Roof Finial (Jeolbyeongtong 절병통) -->
    <path d="M 50 8 L 47 16 L 53 16 Z" fill="var(--color-yellow-gold)" stroke="var(--color-ink)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="50" cy="7" r="2.5" fill="var(--color-red)" stroke="var(--color-ink)" stroke-width="1.5"/>

    <!-- Upper Roof Ridge -->
    <path d="M 28 28 C 38 22 62 22 72 28" stroke="var(--color-ink)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Main Flared Tile Roof (Giwa Cheoma 기와 처마) with Sweeping Upturned Eaves -->
    <path d="M 8 36 C 26 34 40 33 50 33 C 60 33 74 34 92 36 C 96 36 94 32 86 28 C 72 21 28 21 14 28 C 6 32 4 36 8 36 Z" 
          fill="#D66050" stroke="var(--color-ink)" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Eaves Underside & Dancheong Bracket Band (Gongpo 공포) -->
    <rect x="22" y="36" width="56" height="5" fill="var(--color-red)" stroke="var(--color-ink)" stroke-width="1.8"/>
    <!-- Dancheong Color Blocks -->
    <rect x="26" y="37" width="8" height="3" fill="var(--color-yellow-gold)"/>
    <rect x="38" y="37" width="8" height="3" fill="#3D7A68"/>
    <rect x="54" y="37" width="8" height="3" fill="#3D7A68"/>
    <rect x="66" y="37" width="8" height="3" fill="var(--color-yellow-gold)"/>

    <!-- 4 Wooden Pillars (Gidung 기둥) -->
    <rect x="24" y="41" width="5" height="24" fill="var(--color-brown-deep)" stroke="var(--color-ink)" stroke-width="1.8"/>
    <rect x="39" y="41" width="5" height="24" fill="var(--color-brown-deep)" stroke="var(--color-ink)" stroke-width="1.8"/>
    <rect x="56" y="41" width="5" height="24" fill="var(--color-brown-deep)" stroke="var(--color-ink)" stroke-width="1.8"/>
    <rect x="71" y="41" width="5" height="24" fill="var(--color-brown-deep)" stroke="var(--color-ink)" stroke-width="1.8"/>

    <!-- Floor Deck Beam -->
    <rect x="20" y="62" width="60" height="3.5" fill="var(--color-brown-medium)" stroke="var(--color-ink)" stroke-width="1.6"/>

    <!-- Stone Foundation Steps (Gidan 기단) -->
    <rect x="18" y="65.5" width="64" height="4.5" fill="#ECE5DD" stroke="var(--color-ink)" stroke-width="1.8"/>
    <rect x="13" y="70" width="74" height="5.5" fill="#D8D0C5" stroke="var(--color-ink)" stroke-width="1.8"/>
  </svg>
</div>
