{% assign hero_tag = page.hero_tag | default: site.short_title %}
{% assign hero_title = page.title | default: site.title %}
{% assign hero_sub = page.hero_subtitle | default: page.description %}

<section class="page-hero parallax-wrapper" aria-label="{{ hero_title }}">
  <!-- Parallax Layer 1: Supplied Korea Image with Stable, Consistent Framing -->
  <div class="hero-layer hero-bg-layer" data-speed="0.15">
    <img 
      src="{{ page.hero_image | default: '/images/korea1.jpg' | relative_url }}" 
      alt="{{ hero_title }} banner" 
      class="hero-img" 
      style="object-position: {{ page.hero_crop | default: 'center 32%' }};"
      fetchpriority="high"
      loading="eager"
      onerror="this.classList.add('img-error');"
    >
  </div>

  <!-- Parallax Layer 2: Subtle Traditional Korean Window Lattice (Changhosal) Geometry -->
  <div class="hero-layer hero-lattice-layer" data-speed="-0.08" aria-hidden="true">
    <svg class="lattice-pattern-svg" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="pageLatticePattern" width="60" height="60" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="60" height="60" fill="none" stroke="rgba(224, 169, 56, 0.10)" stroke-width="0.8"/>
          <path d="M0 30H60 M30 0V60" stroke="rgba(224, 169, 56, 0.06)" stroke-width="0.6"/>
          <rect x="15" y="15" width="30" height="30" fill="none" stroke="rgba(166, 43, 43, 0.08)" stroke-width="0.7"/>
          <circle cx="30" cy="30" r="3" fill="none" stroke="rgba(78, 52, 46, 0.12)" stroke-width="0.7"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#pageLatticePattern)"/>
    </svg>
  </div>

  <!-- Solid Non-Gloss Scrim for Pristine Contrast -->
  <div class="hero-scrim" aria-hidden="true"></div>

  <!-- Hero Content Layer -->
  <div class="hero-content-layer container">
    <div class="hero-text-block">


      <h1 class="hero-title">{{ hero_title }}</h1>

      <!-- Architectural Hanok Roof Crest & Maehwa Blossom Ornament Under Headline -->
      {% include korean-hero-accent.html %}

      {% if hero_sub %}
      <p class="hero-subtitle">{{ hero_sub }}</p>
      {% endif %}
    </div>
  </div>
</section>
