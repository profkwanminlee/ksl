<div class="korean-divider" aria-hidden="true">
  <span class="divider-line"></span>
  <span class="divider-emblem">
    <!-- Authentic Korean 5-Petal Plum Blossom (Maehwa 매화) & Floral Leaf Vein Motif (Inspired by v1.png) -->
    <svg width="200" height="44" viewBox="0 0 200 44" fill="none" xmlns="http://www.w3.org/2000/svg" class="maehwa-svg">
      <!-- Left Floral Stem / Vein Tendril -->
      <path d="M 82 22 C 68 21 58 15 38 20 C 24 23 14 19 2 22" stroke="var(--color-brown-deep)" stroke-width="1.6" stroke-linecap="round"/>
      
      <!-- Left Upper Leaf with Center Vein (Golden Yellow) -->
      <path d="M 62 20 C 58 11 48 9 42 14 C 48 18 54 19 62 20 Z" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="1.1"/>
      <path d="M 60 19 C 53 15 47 13 42 14" stroke="var(--color-brown-deep)" stroke-width="0.9" stroke-linecap="round"/>

      <!-- Left Lower Leaf with Center Vein (Vermilion) -->
      <path d="M 40 21 C 36 30 26 31 22 26 C 27 23 33 22 40 21 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.1"/>
      <path d="M 38 22 C 31 25 26 27 22 26" stroke="var(--color-brown-deep)" stroke-width="0.9" stroke-linecap="round"/>

      <!-- Left Curled Bud Dot -->
      <circle cx="4" cy="22" r="2.2" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.9"/>

      <!-- Center 5-Petal Korean Maehwa (Plum Blossom) -->
      <g transform="translate(100, 22)" class="maehwa-flower-group">
        <!-- 5 Rounded, Distinct Plump Petals -->
        <path d="M 0,-4 C -5,-6.5 -6.5,-16 0,-17 C 6.5,-16 5,-6.5 0,-4 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.2"/>
        <path d="M 0,-4 C -5,-6.5 -6.5,-16 0,-17 C 6.5,-16 5,-6.5 0,-4 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.2" transform="rotate(72)"/>
        <path d="M 0,-4 C -5,-6.5 -6.5,-16 0,-17 C 6.5,-16 5,-6.5 0,-4 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.2" transform="rotate(144)"/>
        <path d="M 0,-4 C -5,-6.5 -6.5,-16 0,-17 C 6.5,-16 5,-6.5 0,-4 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.2" transform="rotate(216)"/>
        <path d="M 0,-4 C -5,-6.5 -6.5,-16 0,-17 C 6.5,-16 5,-6.5 0,-4 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.2" transform="rotate(288)"/>

        <!-- Subtle Petal Vein Accent Lines -->
        <line x1="0" y1="-4" x2="0" y2="-13" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round"/>
        <line x1="0" y1="-4" x2="0" y2="-13" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round" transform="rotate(72)"/>
        <line x1="0" y1="-4" x2="0" y2="-13" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round" transform="rotate(144)"/>
        <line x1="0" y1="-4" x2="0" y2="-13" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round" transform="rotate(216)"/>
        <line x1="0" y1="-4" x2="0" y2="-13" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round" transform="rotate(288)"/>

        <!-- Center Golden Pistil Hub -->
        <circle cx="0" cy="0" r="4.2" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="1.2"/>

        <!-- 5 Radiating Stamens & Golden Anther Dots -->
        <line x1="0" y1="0" x2="0" y2="-10.5" stroke="var(--color-brown-deep)" stroke-width="1.1" stroke-linecap="round"/>
        <circle cx="0" cy="-10.5" r="1.3" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.7"/>

        <line x1="0" y1="0" x2="0" y2="-10.5" stroke="var(--color-brown-deep)" stroke-width="1.1" stroke-linecap="round" transform="rotate(72)"/>
        <circle cx="10" cy="-3.2" r="1.3" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.7"/>

        <line x1="0" y1="0" x2="0" y2="-10.5" stroke="var(--color-brown-deep)" stroke-width="1.1" stroke-linecap="round" transform="rotate(144)"/>
        <circle cx="6.2" cy="8.5" r="1.3" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.7"/>

        <line x1="0" y1="0" x2="0" y2="-10.5" stroke="var(--color-brown-deep)" stroke-width="1.1" stroke-linecap="round" transform="rotate(216)"/>
        <circle cx="-6.2" cy="8.5" r="1.3" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.7"/>

        <line x1="0" y1="0" x2="0" y2="-10.5" stroke="var(--color-brown-deep)" stroke-width="1.1" stroke-linecap="round" transform="rotate(288)"/>
        <circle cx="-10" cy="-3.2" r="1.3" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.7"/>
      </g>

      <!-- Right Floral Stem / Vein Tendril -->
      <path d="M 118 22 C 132 21 142 15 162 20 C 176 23 186 19 198 22" stroke="var(--color-brown-deep)" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Right Upper Leaf with Center Vein (Golden Yellow) -->
      <path d="M 138 20 C 142 11 152 9 158 14 C 152 18 146 19 138 20 Z" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="1.1"/>
      <path d="M 140 19 C 147 15 153 13 158 14" stroke="var(--color-brown-deep)" stroke-width="0.9" stroke-linecap="round"/>

      <!-- Right Lower Leaf with Center Vein (Vermilion) -->
      <path d="M 160 21 C 164 30 174 31 178 26 C 173 23 167 22 160 21 Z" fill="var(--color-red)" stroke="var(--color-brown-deep)" stroke-width="1.1"/>
      <path d="M 162 22 C 169 25 174 27 178 26" stroke="var(--color-brown-deep)" stroke-width="0.9" stroke-linecap="round"/>

      <!-- Right Curled Bud Dot -->
      <circle cx="196" cy="22" r="2.2" fill="var(--color-yellow-gold)" stroke="var(--color-brown-deep)" stroke-width="0.9"/>
    </svg>
  </span>
  <span class="divider-line"></span>
</div>
