- id: "it-innovation-digital-society"
  number: "01"
  title: "Korea’s IT Innovation & Digital Society"
  tagline: "Digital infrastructures, technological ecosystems, and platform transformation."
  description: "Examines how Korea's advanced digital infrastructures, technological systems, and digital media platforms shape contemporary society, mediate daily interactions, and drive technological and cultural transformation across the region."
  focus_points:
    - "Digital infrastructures, platform ecosystems, and smart societal interfaces"
    - "Algorithmic culture, artificial intelligence, and user experience paradigms"
    - "Technological transformation and digital policy across East and Southeast Asia"
  banner_crop: "70% 35%"

- id: "korean-culture-wave"
  number: "02"
  title: "Contemporary Korean Culture & the Korean Wave"
  tagline: "Transnational circulation, media production, and cultural interpretation."
  description: "Investigates contemporary Korean popular culture and the global circulation of the Korean Wave (Hallyu) across Singapore and Southeast Asia, examining how cultural products are interpreted, translated, and discussed across diverse cultural, social, and political contexts."
  focus_points:
    - "Transnational media diffusion, creative industries, and digital fandoms"
    - "Cultural reception, localization, and hybridity in Southeast Asian contexts"
    - "Visual culture, screen media, and digital cultural reproduction"
  banner_crop: "center 25%"

- id: "human-cultural-exchange"
  number: "03"
  title: "Human & Cultural Exchange between Korea & Southeast Asia"
  tagline: "Regional mobility, institutional networks, and bilateral dialogue."
  description: "Examines historical and contemporary ties connecting Korea with Singapore and Southeast Asia, fostering dialogue and collaboration among scholars, students, and academic, cultural, and policy institutions across Asia."
  focus_points:
    - "Educational mobility, academic networks, and intellectual migration"
    - "Institutional partnerships, cultural diplomacy, and policy dialogues"
    - "Transnational community formation and comparative socio-cultural inquiry"
  banner_crop: "35% 55%"
